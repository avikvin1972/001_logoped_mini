<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашний логопед</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #f4f8ff; color: #1a2540; }
  .screen { display: none; min-height: 100vh; padding: 24px 20px 70px; text-align: center; }
  .screen.active { display: block; }
  h1, h2 { margin: 12px 0 24px; }
  .btn { display: block; width: 100%; max-width: 380px; margin: 14px auto; padding: 20px;
         font-size: 22px; border: 0; border-radius: 16px; background: #2d7ff9; color: #fff; }
  .btn.off { background: #c4cbd8; color: #fff; }
  .btn:disabled { background: #c4cbd8; }
  .text { max-width: 380px; margin: 0 auto 20px; font-size: 18px; line-height: 1.4; text-align: left; }
  label { display: block; max-width: 380px; margin: 0 auto 20px; font-size: 18px; text-align: left; }
  input[type=checkbox] { width: 24px; height: 24px; vertical-align: middle; margin-right: 10px; }
  #disclaimer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; text-align: center;
                background: #fff3cd; font-size: 15px; border-top: 1px solid #e6d9a0; }
  #pic { font-size: 120px; line-height: 1.2; min-height: 150px; }
  #pic img { max-height: 140px; }
  #counter { color: #5b6784; font-size: 16px; }
  #rec-state { min-height: 28px; font-size: 18px; margin-bottom: 8px; }
  .btn.recording { background: #d93025; }
  audio { width: 100%; max-width: 380px; margin: 8px 0 16px; }
  .dbtn { display: block; width: 100%; max-width: 380px; margin: 8px auto; padding: 16px; font-size: 20px;
          border-radius: 14px; border: 3px solid #d5dbe8; background: #fff; color: #1a2540; }
  .dbtn.sel { border-color: #2d7ff9; background: #e3eeff; font-weight: bold; }
  #saved-count { color: #5b6784; font-size: 15px; margin: 8px 0 16px; min-height: 20px; }
  #note { max-width: 380px; margin: 10px auto; color: #b3261e; min-height: 24px; }
</style>
</head>
<body>

<!-- Экран 1: язык -->
<div class="screen active" id="s-lang">
  <h1 data-t="app_title"></h1>
  <h2 data-t="lang_title"></h2>
  <button class="btn" id="btn-ru" data-t="lang_ru"></button>
  <button class="btn off" data-t="lang_uz_soon" disabled></button>
</div>

<!-- Экран 2: согласие -->
<div class="screen" id="s-consent">
  <h2 data-t="consent_title"></h2>
  <p class="text" data-t="consent_text"></p>
  <label><input type="checkbox" id="chk"><span data-t="consent_check"></span></label>
  <button class="btn" id="btn-consent" data-t="btn_continue" disabled></button>
</div>

<!-- Экран 3: возраст -->
<div class="screen" id="s-age">
  <h2 data-t="age_title"></h2>
  <button class="btn off" data-age="1" data-t="age_1"></button>
  <button class="btn" data-age="2" data-t="age_2"></button>
  <button class="btn off" data-age="3" data-t="age_3"></button>
</div>

<!-- Экран 4: меню -->
<div class="screen" id="s-menu">
  <h2 data-t="menu_title"></h2>
  <div id="menu-note" style="color:#1e8e3e;font-size:20px;min-height:28px;margin-bottom:8px"></div>
  <button class="btn" id="btn-sounds" data-t="menu_sounds"></button>
  <button class="btn off" data-t="menu_tempo"></button>
  <button class="btn off" data-t="menu_phonemic"></button>
  <button class="btn" id="btn-summary" data-t="summary_title"></button>
</div>

<!-- Экран 5: задание -->
<div class="screen" id="s-task">
  <div id="counter"></div>
  <div id="model-state" style="color:#5b6784;font-size:15px;min-height:20px"></div>
  <div id="pic"></div>
  <h2 data-t="task_prompt"></h2>
  <button class="btn" id="btn-rec" data-t="btn_record"></button>
  <div id="rec-state"></div>
  <div id="play-box" style="display:none">
    <div data-t="label_your_record"></div>
    <audio id="player" controls></audio>
  </div>
  <div id="heard-box" style="display:none">
    <div data-t="label_heard"></div>
    <div id="heard" style="font-size:32px;font-weight:bold;margin:8px 0 8px"></div>
    <div id="match" style="font-size:22px;font-weight:bold;margin:0 0 16px"></div>
    <div style="font-size:18px;margin-bottom:4px" data-t="doctor_title"></div>
    <button class="dbtn" data-score="2" data-t="doctor_2"></button>
    <button class="dbtn" data-score="1" data-t="doctor_1"></button>
    <button class="dbtn" data-score="0" data-t="doctor_0"></button>
    <div id="saved-count"></div>
  </div>
  <button class="btn" id="btn-next" data-t="btn_next"></button>
  <button class="btn off" id="btn-back" data-t="btn_back"></button>
</div>

<!-- Экран 6: сводка -->
<div class="screen" id="s-summary">
  <h2 data-t="summary_title"></h2>
  <div id="sum-count" style="font-size:22px;margin:8px 0"></div>
  <div id="sum-rated" style="font-size:22px;margin:8px 0"></div>
  <div id="sum-agree" style="font-size:26px;font-weight:bold;margin:12px 0"></div>
  <p class="text" style="font-size:15px;color:#5b6784" data-t="summary_note"></p>
  <button class="btn" id="btn-export" data-t="btn_export"></button>
  <button class="btn" id="btn-export-csv" data-t="btn_export_csv"></button>
  <button class="btn off" id="btn-clear" data-t="btn_clear"></button>
  <button class="btn off" id="btn-sum-back" data-t="btn_back"></button>
</div>

<div id="note"></div>
<div id="disclaimer"><span data-t="disclaimer"></span> <small style="color:#999">v9</small></div>

<script>
  var T = {};            // сюда загрузятся тексты из lang/ru.json
  var state = { lang: 'ru', age: null };

  // Показать нужный экран
  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    document.getElementById('note').textContent = '';
  }

  // Подставить тексты во все элементы с атрибутом data-t
  function applyTexts() {
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = T[el.getAttribute('data-t')] || el.getAttribute('data-t');
    });
  }

  // Загрузка текстов, затем запуск
  fetch('lang/ru.json')
    .then(function (r) { return r.json(); })
    .then(function (data) { T = data; applyTexts(); })
    .catch(function () { document.getElementById('note').textContent = 'Не удалось загрузить тексты (lang/ru.json)'; });

  // Кнопки
  document.getElementById('btn-ru').onclick = function () { state.lang = 'ru'; show('s-consent'); };

  document.getElementById('chk').onchange = function () {
    document.getElementById('btn-consent').disabled = !this.checked;
  };
  document.getElementById('btn-consent').onclick = function () { show('s-age'); };

  document.querySelectorAll('[data-age]').forEach(function (b) {
    b.onclick = function () {
      if (b.getAttribute('data-age') !== '2') return;   // пока работает только 5–7
      state.age = 2;
      show('s-menu');
    };
  });


  // ---------- Задание: слово, картинка, запись ----------
  var words = [];
  var idx = 0;
  var recorder = null, chunks = [], stream = null;
  var lastBlob = null;          // последняя запись (пока только в памяти)

  fetch('words.json').then(function (r) { return r.json(); }).then(function (d) { words = d; });

  function showWord() {
    var w = words[idx];
    var pic = document.getElementById('pic');
    pic.innerHTML = '';
    if (w.img) { var im = document.createElement('img'); im.src = w.img; pic.appendChild(im); }
    else { pic.textContent = w.pic; }
    document.getElementById('counter').textContent =
      T.task_counter.replace('{i}', idx + 1).replace('{n}', words.length);
    document.getElementById('play-box').style.display = 'none';
    document.getElementById('heard-box').style.display = 'none';
    currentRec = null;
    document.getElementById('rec-state').textContent = '';
    lastBlob = null;
  }

  document.getElementById('btn-sounds').onclick = function () {
    idx = 0; document.getElementById('menu-note').textContent = ''; show('s-task'); showWord(); loadAsr();
  };
  document.getElementById('btn-back').onclick = function () { show('s-menu'); };

  document.getElementById('btn-next').onclick = function () {
    if (idx < words.length - 1) { idx++; showWord(); }
    else { show('s-menu'); document.getElementById('menu-note').textContent = '✅ ' + T.task_done; }
  };

  var recBtn = document.getElementById('btn-rec');
  recBtn.onclick = async function () {
    if (recorder && recorder.state === 'recording') { recorder.stop(); return; }   // второе нажатие = стоп
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      document.getElementById('rec-state').textContent = T.err_mic;
      return;
    }
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function (e) { chunks.push(e.data); };
    recorder.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });          // выключаем микрофон
      lastBlob = new Blob(chunks, { type: recorder.mimeType });
      var player = document.getElementById('player');
      player.src = URL.createObjectURL(lastBlob);
      document.getElementById('play-box').style.display = 'block';
      recBtn.textContent = T.btn_record;
      recBtn.classList.remove('recording');
      document.getElementById('rec-state').textContent = '';
      recognize(lastBlob);
    };
    recorder.start();
    recBtn.textContent = T.btn_stop;
    recBtn.classList.add('recording');
    document.getElementById('rec-state').textContent = T.state_recording;
  };



  // ---------- Хранение записей на устройстве (IndexedDB) ----------
  var dbPromise = null;
  function openDb() {
    if (!dbPromise) {
      dbPromise = new Promise(function (resolve, reject) {
        var req = indexedDB.open('logoped', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('records', { keyPath: 'id' }); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    }
    return dbPromise;
  }
  function dbPut(rec) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('records', 'readwrite');
        tx.objectStore('records').put(rec);
        tx.oncomplete = resolve;
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function dbCount() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var r = db.transaction('records').objectStore('records').count();
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function updateCount() {
    dbCount().then(function (n) {
      document.getElementById('saved-count').textContent = 'Сохранено записей: ' + n;
    }).catch(function () {});
  }

  // ---------- Оценка врача ----------
  var currentRec = null;       // запись, которую врач сейчас оценивает
  document.querySelectorAll('.dbtn').forEach(function (b) {
    b.onclick = function () {
      if (!currentRec) return;
      currentRec.doctor = Number(b.getAttribute('data-score'));
      document.querySelectorAll('.dbtn').forEach(function (x) { x.classList.remove('sel'); });
      b.classList.add('sel');
      dbPut(currentRec).then(updateCount).catch(function (e) {
        document.getElementById('rec-state').textContent = 'Не удалось сохранить: ' + (e.message || e);
      });
    };
  });


  // ---------- Сводка и экспорт ----------
  function dbAll() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var r = db.transaction('records').objectStore('records').getAll();
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function dbClear() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('records', 'readwrite');
        tx.objectStore('records').clear();
        tx.oncomplete = resolve;
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  function today() { return new Date().toISOString().slice(0, 10); }

  async function showSummary() {
    var recs = await dbAll();
    var rated = recs.filter(function (r) { return r.doctor !== null && r.doctor !== undefined; });
    var agree = rated.filter(function (r) { return r.modelMatch === (r.doctor === 2); }).length;
    document.getElementById('sum-count').textContent = T.summary_count.replace('{n}', recs.length);
    document.getElementById('sum-rated').textContent = T.summary_rated.replace('{k}', rated.length);
    document.getElementById('sum-agree').textContent = rated.length
      ? T.summary_agree.replace('{p}', Math.round(100 * agree / rated.length))
      : T.summary_agree.replace('{p}', '—');
    show('s-summary');
  }
  document.getElementById('btn-summary').onclick = showSummary;
  document.getElementById('btn-sum-back').onclick = function () { show('s-menu'); };

  // Полная выгрузка (JSON, звук внутри в виде текста base64)
  document.getElementById('btn-export').onclick = async function () {
    var recs = await dbAll();
    var out = [];
    for (var i = 0; i < recs.length; i++) {
      var r = Object.assign({}, recs[i]);
      if (r.audio) {
        r.audio = await new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { res(fr.result); };
          fr.readAsDataURL(recs[i].audio);
        });
      }
      out.push(r);
    }
    download('logoped_zapisi_' + today() + '.json',
             new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  };

  // Таблица для врача (CSV открывается в Excel и Google Таблицах)
  document.getElementById('btn-export-csv').onclick = async function () {
    var recs = await dbAll();
    function q(v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; }
    var lines = ['код;дата;слово;услышала нейросеть;модель (1=похоже);врач (2/1/0);возраст;язык'];
    recs.forEach(function (r) {
      lines.push([r.code, r.date, r.word, r.heard, r.modelMatch ? 1 : 0, r.doctor, r.ageGroup, r.lang].map(q).join(';'));
    });
    download('logoped_tablica_' + today() + '.csv',
             new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
  };

  document.getElementById('btn-clear').onclick = async function () {
    if (confirm(T.confirm_clear)) { await dbClear(); showSummary(); }
  };

  // ---------- Сравнение с целевым словом ----------
  function norm(t) {
    return t.toLowerCase().replace(/ё/g, 'е').replace(/[^а-я\s]/g, ' ').trim();
  }
  function lev(a, b) {            // сколько букв нужно изменить, чтобы из a получить b
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (j = 1; j <= b.length; j++) { d[0][j] = j; }
    for (i = 1; i <= a.length; i++) {
      for (j = 1; j <= b.length; j++) {
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1,
                           d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      }
    }
    return d[a.length][b.length];
  }
  // «Похоже», если какое-то услышанное слово совпало с целевым (или допустимым) на 80% и больше
  function isMatch(heardText, w) {
    var targets = [w.word].concat(w.accepted || []);
    var tokens = norm(heardText).split(/\s+/).filter(Boolean);
    for (var i = 0; i < tokens.length; i++) {
      for (var j = 0; j < targets.length; j++) {
        var sim = 1 - lev(tokens[i], targets[j]) / Math.max(tokens[i].length, targets[j].length);
        if (sim >= 0.8) return true;
      }
    }
    return false;
  }

  // ---------- Нейросеть Whisper (распознавание речи) ----------
  var asrPromise = null;

  // Загружаем модель один раз; браузер запоминает её, в следующий раз быстрее
  function loadAsr() {
    if (!asrPromise) {
      var ms = document.getElementById('model-state');
      ms.textContent = T.msg_model_loading;
      asrPromise = (async function () {
        function onProgress(p) {
          if (p.status === 'progress' && p.progress != null) {
            ms.textContent = T.msg_model_loading + ' ' + Math.round(p.progress) + '%';
          }
        }
        // Пробуем по очереди: [версия библиотеки, вариант модели]
        var attempts = [['3', 'q8'], ['3', 'fp32'], ['4.2.0', 'fp32']];
        var errs = [], asr = null, used = '';
        for (var i = 0; i < attempts.length && !asr; i++) {
          try {
            var m = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@' + attempts[i][0]);
            asr = await m.pipeline('automatic-speech-recognition', 'Xenova/whisper-base',
                                   { dtype: attempts[i][1], progress_callback: onProgress });
            used = 'v' + attempts[i][0] + ' ' + attempts[i][1];
          } catch (e) {
            errs.push('[' + attempts[i][0] + ' ' + attempts[i][1] + '] ' + String(e.message || e).slice(0, 110));
          }
        }
        if (!asr) throw new Error(errs.join(' | '));
        ms.textContent = T.msg_model_ready + ' (' + used + ')';
        return asr;
      })();
      asrPromise.catch(function (e) {
        document.getElementById('model-state').textContent = (T.err_asr || 'Ошибка: ') + (e.message || e);
        asrPromise = null;
      });
    }
    return asrPromise;
  }

  // Запись (webm/mp4) -> числа 16 кГц, как нужно Whisper
  async function blobToFloat32(blob) {
    var buf = await blob.arrayBuffer();
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC({ sampleRate: 16000 });
    var audio = await ctx.decodeAudioData(buf);
    ctx.close();
    return audio.getChannelData(0);
  }

  async function recognize(blob) {
    var rs = document.getElementById('rec-state');
    rs.textContent = T.state_listening;
    recBtn.disabled = true;
    try {
      var asr = await loadAsr();
      var audio = await blobToFloat32(blob);
      var t0 = performance.now();
      var out = await asr(audio, { language: 'russian', task: 'transcribe' });
      var sec = ((performance.now() - t0) / 1000).toFixed(1);
      document.getElementById('heard').textContent = (out.text || '').trim() || '—';
      var ok = isMatch(out.text || '', words[idx]);
      var mEl = document.getElementById('match');
      mEl.textContent = ok ? '✅ ' + T.match_yes : '❔ ' + T.match_no;
      mEl.style.color = ok ? '#1e8e3e' : '#e37400';
      currentRec = {
        id: Date.now(), code: 'R' + Date.now().toString(36),
        wordId: words[idx].id, word: words[idx].word, ageGroup: '5-7', lang: 'ru',
        heard: (out.text || '').trim(), modelMatch: ok, doctor: null,
        date: new Date().toISOString(), mime: blob.type, audio: blob
      };
      document.querySelectorAll('.dbtn').forEach(function (x) { x.classList.remove('sel'); });
      updateCount();
      document.getElementById('heard-box').style.display = 'block';
      rs.textContent = '⏱ ' + sec + ' c';
    } catch (e) {
      rs.textContent = (T.err_asr || 'Ошибка: ') + (e.message || e);
    }
    recBtn.disabled = false;
  }
</script>
</body>
</html>
